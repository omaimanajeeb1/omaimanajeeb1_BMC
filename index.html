  <script src="/_sdk/5629ea66dc55d54f.editing_sdk.js" integrity="sha512-snPYzGvgiTEMUBOb+HlCBkFeiM0IRX4hcgA78wvalhC0WnJtaX+RCbosPWtNqZsZ7sZ9NwN0oePZYa+IlMwa+w=="></script>
  <script>
    document.querySelectorAll('.section-toggle').forEach(button => button.addEventListener('click', () => {
      const section = button.closest('section');
      const collapsed = section.classList.toggle('section-collapsed');
      button.setAttribute('aria-expanded', String(!collapsed));
    }));
    const state = { records: [], initialized: false, editingTaskId: "" };
    function taskRecords(){ return state.records.filter(r=>r.task_title); }
    function memberRecords(){ return state.records.filter(r=>r.member_name); }
    function operationRecords(){ return state.records.filter(r=>r.operation_type); }
    function renderOperations(){ const list=$("operationList"); const type=$("operationTypeFilter").value, date=$("operationDateFilter").value; const rows=operationRecords().filter(r=>(type==="all"||r.operation_type===type)&&(!date||String(r.operation_at||"").startsWith(date))).sort((a,b)=>(b.operation_at||"").localeCompare(a.operation_at||"")); list.innerHTML=rows.length?rows.map(r=>`<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-[#e6eef0] pb-3 last:border-0 last:pb-0"><div><p class="font-bold">${esc(r.operation_details||r.operation_type)}</p><p class="text-xs text-slate-500 mt-1">${esc(r.operation_entity||"سجل")} · ${esc(r.operation_actor||"النظام")}</p></div><time class="text-xs text-slate-500" datetime="${esc(r.operation_at)}">${esc(new Date(r.operation_at).toLocaleString("ar-SA"))}</time></div>`).join(""):"<p class=\"text-sm text-slate-500\">لا توجد عمليات مطابقة.</p>"; }
    async function logOperation(type, entity, id, details){ if(!window.dataSdk) return; await window.dataSdk.create({operation_type:type,operation_entity:entity,operation_record_id:id||"",operation_details:details,operation_actor:"المستخدمة",operation_at:new Date().toISOString(),archived:false,created_at:new Date().toISOString(),updated_at:new Date().toISOString()}); }
    function taskDueState(t){ const today=new Date().toISOString().slice(0,10); if(!t.task_reminder || !t.task_due_date || t.task_status==="مكتملة") return ""; return t.task_due_date<today ? "overdue" : t.task_due_date===today ? "today" : ""; }
    function renderTaskAlerts(){ const box=$("taskAlerts"), alerts=taskRecords().map(t=>({task:t,state:taskDueState(t)})).filter(x=>x.state); if(!alerts.length){ box.classList.add("hidden"); box.innerHTML=""; return; } box.classList.remove("hidden"); box.innerHTML=alerts.map(({task,state})=>`<div class="rounded-2xl border px-4 py-3 flex items-start gap-3 bg-rose-50 border-rose-200 text-rose-800"><i data-lucide="${state==="overdue"?"triangle-alert":"bell-ring"}" class="w-5 h-5 shrink-0 mt-0.5"></i><div><p class="font-extrabold">${state==="overdue"?"مهمة متأخرة":"مهمة مستحقة اليوم"}</p><p class="text-sm mt-1">${esc(task.task_title)}${task.assignee?" · "+esc(task.assignee):""}</p></div></div>`).join(""); lucide.createIcons(); }
    function renderTasks(){ const list=$("taskList"); list.innerHTML=""; taskRecords().sort((a,b)=>(a.task_due_date||"").localeCompare(b.task_due_date||"")).forEach(t=>{ const card=document.createElement("article"); const due=taskDueState(t); card.className="stat-card rounded-2xl p-5 "+(due==="overdue"||due==="today"?"border-rose-300 bg-rose-50/40":""); card.innerHTML=`<div class="flex items-start justify-between gap-3"><div><h3 class="font-extrabold text-lg">${esc(t.task_title)}</h3><p class="text-sm text-slate-500 mt-1">${esc(t.team_name||"بدون فريق")} · ${esc(t.assignee||"غير مُسند")}</p></div><span class="text-xs font-bold rounded-full px-2.5 py-1 bg-[#e4f5f3] text-[#137176]">${esc(t.task_status||"جديدة")}</span></div><p class="text-xs text-slate-500 mt-4">الأولوية: ${esc(t.task_priority||"عادية")} · التسليم: ${esc(t.task_due_date||"غير محدد")}</p>${due?`<p class="text-xs font-extrabold mt-2 text-rose-700">${due==="overdue"?"متأخرة عن الموعد":"مستحقة اليوم"}</p>`:""}<p class="text-xs text-slate-600 mt-2">الشروط: ${esc(t.task_conditions||"لا توجد شروط محددة")}</p><p class="text-xs font-bold mt-2 ${t.task_approved ? "text-emerald-700" : "text-amber-700"}">${t.task_approved ? "معتمدة" : "بانتظار الاعتماد"}${t.approved_by ? " · " + esc(t.approved_by) : ""}</p><div class="flex gap-2 mt-4"><button type="button" class="edit-task rounded-lg px-3 py-2 text-xs font-bold bg-slate-100 text-slate-700" data-id="${esc(t.__backendId)}">تعديل</button><button type="button" class="complete-task rounded-lg px-3 py-2 text-xs font-bold bg-emerald-50 text-emerald-700" data-id="${esc(t.__backendId)}">${t.task_status==="مكتملة"?"إعادة فتح":"إتمام المهمة"}</button></div>`; card.querySelector(".edit-task").addEventListener("click",()=>editTask(t)); card.querySelector(".complete-task").addEventListener("click",()=>completeTask(t)); list.appendChild(card); }); renderTaskAlerts(); renderMemberWork(); }
    async function editTask(t){ state.editingTaskId=t.__backendId; $("taskTitle").value=t.task_title||""; $("taskStatus").value=t.task_status||"جديدة"; $("taskPriority").value=t.task_priority||"عادية"; $("taskDueDate").value=t.task_due_date||""; $("taskConditions").value=t.task_conditions||""; $("taskReminder").checked=!!t.task_reminder; $("taskApproved").checked=!!t.task_approved; refreshTaskTeams(); $("taskTeam").value=t.team_name||""; refreshAssignees(); $("taskAssignee").value=t.assignee||""; $("saveTask").textContent="حفظ التعديل"; $("taskTitle").focus(); }
    async function completeTask(t){ const result=await window.dataSdk.update({...t,task_status:t.task_status==="مكتملة"?"قيد التنفيذ":"مكتملة",task_completed:t.task_status!=="مكتملة",task_progress:t.task_status!=="مكتملة"?100:0,updated_at:new Date().toISOString()}); if(!result.isOk) showToast("تعذر تحديث المهمة."); }
    function renderMemberWork(){ const list=$("memberWorkList"); list.innerHTML=""; const tasks=taskRecords(); state.records.filter(r=>r.entity_type==="team"&&!r.archived).forEach(team=>{ const members=(team.team_members||"").split(/[,،\n]/).map(v=>v.trim()).filter(Boolean); members.forEach(member=>{ const assigned=tasks.filter(t=>t.team_name===team.name&&t.assignee===member); const card=document.createElement("article"); card.className="stat-card rounded-2xl p-5"; card.innerHTML=`<div class="flex items-center justify-between gap-3"><div><h4 class="font-extrabold">${esc(member)}</h4><p class="text-xs text-slate-500 mt-1">${esc(team.name)} · ${assigned.length} مهمة</p></div><span class="rounded-full px-2.5 py-1 text-xs font-bold bg-[#e4f5f3] text-[#137176]">${assigned.filter(t=>t.task_status==="مكتملة").length} مكتملة</span></div><div class="mt-4 space-y-2">${assigned.length ? assigned.map(t=>`<div class="flex items-center justify-between gap-2 text-sm border-t border-[#e6eef0] pt-2"><span class="truncate">${esc(t.task_title)}</span><span class="text-xs text-slate-500 whitespace-nowrap">${esc(t.task_status||"جديدة")}</span></div>`).join("") : '<p class="text-sm text-slate-500">لا توجد مهام مسندة بعد.</p>'}</div><div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-4"><button type="button" class="member-report rounded-xl px-3 py-2.5 text-sm font-bold bg-[#edf3f5] text-[#496270] hover:bg-[#e4f5f3] focus:outline-none focus:ring-2 focus:ring-teal-300">إصدار تقرير مهني للعضو</button><button type="button" class="member-financial-report rounded-xl px-3 py-2.5 text-sm font-bold bg-[#e4f5f3] text-[#137176] hover:bg-[#d5efec] focus:outline-none focus:ring-2 focus:ring-teal-300">إصدار التقرير المالي</button></div>`; card.querySelector(".member-report").addEventListener("click",()=>printMemberReport(member,team.name,assigned)); card.querySelector(".member-financial-report").addEventListener("click",()=>printMemberFinancialReport(member,team.name)); list.appendChild(card); }); }); }
    function printMemberReport(member, teamName, tasks){ const completed=tasks.filter(t=>t.task_status==="مكتملة"), pending=tasks.filter(t=>t.task_status!=="مكتملة"); const rows=list=>list.length?list.map(t=>`<tr><td>${esc(t.task_title)}</td><td>${esc(t.task_status||"جديدة")}</td><td>${esc(t.task_priority||"عادية")}</td><td>${esc(t.task_due_date||"غير محدد")}</td></tr>`).join(""):'<tr><td colspan="4">لا توجد مهام</td></tr>'; const w=window.open("","_blank"); if(!w)return; w.document.write(`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>التقرير المهني - ${esc(member)}</title><style>body{font-family:Arial,sans-serif;color:#18324a;padding:32px;line-height:1.7}h1,h2{color:#167c80;border-bottom:2px solid #167c80;padding-bottom:10px}table{width:100%;border-collapse:collapse;margin:12px 0 28px}th,td{border:1px solid #dce8ed;padding:10px;text-align:right}th{background:#e4f5f3}@media print{button{display:none}}</style></head><body><h1>التقرير المهني للعضو</h1><p><b>العضو:</b> ${esc(member)} · <b>الفريق:</b> ${esc(teamName)}</p><h2>المهام المكتملة (${completed.length})</h2><table><thead><tr><th>المهمة</th><th>الحالة</th><th>الأولوية</th><th>موعد التسليم</th></tr></thead><tbody>${rows(completed)}</tbody></table><h2>المهام غير المكتملة (${pending.length})</h2><table><thead><tr><th>المهمة</th><th>الحالة</th><th>الأولوية</th><th>موعد التسليم</th></tr></thead><tbody>${rows(pending)}</tbody></table><script>window.onload=()=>window.print()<\/script></body></html>`); w.document.close(); }
    function printMemberFinancialReport(member, teamName){ const records=memberRecords().filter(r=>r.member_name===member&&(r.member_team||"")===teamName); const credit=records.reduce((sum,r)=>sum+(Number(r.member_credit)||0),0), debit=records.reduce((sum,r)=>sum+(Number(r.member_debit)||0),0), remaining=credit-debit; const rows=records.length?records.map(r=>`<tr><td>${esc(r.member_statement||"—")}</td><td>${money.format(Number(r.member_credit)||0)}</td><td>${money.format(Number(r.member_debit)||0)}</td><td>${money.format((Number(r.member_credit)||0)-(Number(r.member_debit)||0))}</td></tr>`).join(""):'<tr><td colspan="4">لا توجد حركات مالية مسجلة</td></tr>'; const w=window.open("","_blank"); if(!w)return; w.document.write(`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>التقرير المالي - ${esc(member)}</title><style>body{font-family:Arial,sans-serif;color:#18324a;padding:32px;line-height:1.7}h1,h2{color:#167c80;border-bottom:2px solid #167c80;padding-bottom:10px}table{width:100%;border-collapse:collapse;margin:18px 0 28px}th,td{border:1px solid #dce8ed;padding:10px;text-align:right}th{background:#e4f5f3}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.box{border:1px solid #dce8ed;border-radius:10px;padding:14px}@media print{button{display:none}}</style></head><body><h1>التقرير المالي للعضو</h1><p><b>العضو:</b> ${esc(member)} · <b>الفريق:</b> ${esc(teamName)}</p><div class="summary"><div class="box">إجمالي الدائن<br><b>${money.format(credit)}</b></div><div class="box">إجمالي المدين<br><b>${money.format(debit)}</b></div><div class="box">المتبقي عليه<br><b>${money.format(remaining)}</b></div></div><h2>كشف الحساب</h2><table><thead><tr><th>البيان</th><th>الدائن</th><th>المدين</th><th>المتبقي</th></tr></thead><tbody>${rows}</tbody></table><script>window.onload=()=>window.print()<\/script></body></html>`); w.document.close(); }

    function printReport(title, sections){ const day=new Date().toLocaleDateString("ar-SA"); const w=window.open("","_blank"); if(!w)return; w.document.write(`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>${title}</title><style>body{font-family:Arial,sans-serif;color:#18324a;padding:32px;line-height:1.7}h1,h2{color:#167c80;border-bottom:2px solid #167c80;padding-bottom:10px}.row{border-bottom:1px solid #e6eef0;padding:8px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.box{border:1px solid #dce8ed;border-radius:10px;padding:12px}@media print{button{display:none}}</style></head><body><h1>${title}</h1><p>التاريخ: ${day}</p>${sections}<script>window.onload=()=>window.print()<\\/script></body></html>`); w.document.close(); }
    $("financialReportPdf").addEventListener("click",()=>{ const a=state.records.filter(r=>!r.archived); printReport("التقرير المالي",`<h2>الملخص المالي</h2><div class="grid"><div class="box">الميزانيات<br><b>${money.format(a.reduce((n,r)=>n+(Number(r.budget)||0),0))}</b></div><div class="box">الإيرادات<br><b>${money.format(a.reduce((n,r)=>n+(Number(r.income)||0),0))}</b></div><div class="box">المصروفات<br><b>${money.format(a.reduce((n,r)=>n+(Number(r.expenses)||0),0))}</b></div><div class="box">الصافي<br><b>${money.format(a.reduce((n,r)=>n+(Number(r.income)||0)-(Number(r.expenses)||0),0))}</b></div></div>${a.map(r=>`<div class="row"><b>${esc(r.name||"سجل")}</b> — الإيرادات: ${money.format(Number(r.income)||0)} — المصروفات: ${money.format(Number(r.expenses)||0)}</div>`).join("")}`); });
    $("professionalReportPdf").addEventListener("click",()=>{ const a=state.records.filter(r=>!r.archived); printReport("التقرير المهني",`<h2>ملخص الأداء التشغيلي</h2><div class="grid"><div class="box">الشركات<br><b>${a.filter(r=>r.entity_type==="company").length}</b></div><div class="box">الفرق<br><b>${a.filter(r=>r.entity_type==="team").length}</b></div><div class="box">المهام<br><b>${taskRecords().length}</b></div><div class="box">المكتملة<br><b>${taskRecords().filter(r=>r.task_status==="مكتملة").length}</b></div></div>${a.map(r=>`<div class="row"><b>${esc(r.name||r.task_title||"سجل")}</b> — ${esc(r.status||r.task_status||"غير محدد")} — المسؤول: ${esc(r.owner||r.assignee||"غير محدد")}</div>`).join("")}`); });
    $("dailyReportPdf").addEventListener("click",()=>{ const day=new Date().toLocaleDateString("ar-SA"); const active=state.records.filter(r=>!r.archived); const html=`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>التقرير اليومي - ${day}</title><style>body{font-family:Arial,sans-serif;color:#18324a;padding:32px;line-height:1.7}h1{color:#167c80;border-bottom:2px solid #167c80;padding-bottom:12px}h2{margin-top:28px;color:#167c80}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.box{border:1px solid #dce8ed;border-radius:10px;padding:12px}.row{border-bottom:1px solid #e6eef0;padding:8px 0}@media print{button{display:none}}</style></head><body><h1>التقرير اليومي الكامل</h1><p>التاريخ: ${day}</p><div class="grid"><div class="box">الشركات<br><b>${active.filter(r=>r.entity_type==="company").length}</b></div><div class="box">الفروع<br><b>${active.filter(r=>r.entity_type==="branch").length}</b></div><div class="box">المهام<br><b>${taskRecords().length}</b></div><div class="box">السجلات<br><b>${active.length}</b></div></div><h2>الكيانات والمهام</h2>${active.map(r=>`<div class="row"><b>${esc(r.name||r.task_title||r.member_name||r.client_name||"سجل")}</b> — ${esc(r.status||r.task_status||"سجل")} — المسؤول: ${esc(r.owner||r.assignee||"غير محدد")}</div>`).join("")}<h2>الملخص المالي</h2><p>الميزانيات: ${money.format(active.reduce((n,r)=>n+(Number(r.budget)||0),0))} | الإيرادات: ${money.format(active.reduce((n,r)=>n+(Number(r.income)||0),0))} | المصروفات: ${money.format(active.reduce((n,r)=>n+(Number(r.expenses)||0),0))}</p><script>window.onload=()=>window.print()<\\/script></body></html>`; const w=window.open("","_blank"); if(w){w.document.write(html);w.document.close();} });

    const handler = { onDataChanged(data) { state.records=data; renderAll(); } };
    (async () => {
      const init = await window.dataSdk.init(handler);
      if(!init.isOk) {
        $("emptyState").classList.remove("hidden");
        $("emptyState").querySelector("p").textContent="تعذر تحميل البيانات حالياً.";
      }
    })();
    lucide.createIcons();
  </script>
